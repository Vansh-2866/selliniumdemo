<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5;
           display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 30px; border-radius: 8px; width: 280px;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #1a73e8; color: #fff; border: 0; cursor: pointer; }
    #error { color: red; min-height: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Login</button>
    <p id="error"></p>
  </div>

  <script>
    function login() {
      var user = document.getElementById("username").value.trim();
      var pass = document.getElementById("password").value;
      var error = document.getElementById("error");

      if (user === "" || pass === "") {
        error.textContent = "Username and password are required";
      } else if (user === "admin" && pass === "admin123") {
        window.location.href = "dashboard.html";
      } else {
        error.textContent = "Invalid username or password";
      }
    }
  </script>
</body>
</html>
